name: Build Noclip for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Windows Geode package
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Build mod with Geode SDK
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
          build-config: Release

      - name: Upload Windows Geode package
        uses: actions/upload-artifact@v4
        with:
          name: Noclip-Windows-Geode
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 30
