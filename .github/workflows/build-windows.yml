name: Build Noclip Input Buffer Lab (Win)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test independent queue
        run: g++ -std=c++20 -O2 -Wall -Wextra tests/queue_tests.cpp -o /tmp/testqueue && /tmp/testqueue
      - name: Compile and test trajectory geometry
        run: g++ -std=c++20 -O2 -Wall -Wextra tests/wave_tests.cpp -o /tmp/testwave && /tmp/testwave
  build:
    runs-on: windows-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode Win64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
          build-config: Release
      - uses: actions/upload-artifact@v4
        with:
          name: Noclip-Windows-Geode
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error