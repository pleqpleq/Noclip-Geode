name: Build Noclip for Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++20 -O2 tests/test_wave.cpp -o /tmp/test_wave && /tmp/test_wave
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
          build-config: Release
      - uses: actions/upload-artifact@v4
        with:
          name: Noclip-Windows-Geode
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
